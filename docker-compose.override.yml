# Automatically merged with docker-compose.yml by `docker compose up`.
# Mounts only source directories so node_modules stays inside the container.
# Next.js hot reload picks up changes to src/ and public/ immediately.
services:
  app:
    build:
      context: .
      target: dev
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - media:/app/public/media
    environment:
      - NODE_ENV=development
