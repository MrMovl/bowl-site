# Automatically merged with docker-compose.yml by `docker compose up`.
# Configures the app service for local development: source code is
# mounted so Next.js hot reload works without rebuilding the image.
services:
  app:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
      - media:/app/public/media
    environment:
      - NODE_ENV=development
