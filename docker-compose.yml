services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bowl_site_dev
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - mix_deps:/app/deps
      - mix_build:/app/_build
      - node_modules:/app/assets/node_modules
    environment:
      MIX_ENV: dev
      DATABASE_URL: ecto://postgres:postgres@db/bowl_site_dev
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "mix deps.get &&
             cd assets && npm install && cd .. &&
             mix ecto.create --quiet &&
             mix ecto.migrate &&
             mix phx.server"

volumes:
  postgres_dev:
  mix_deps:
  mix_build:
  node_modules:
